services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: horizon
      POSTGRES_USER: horizon
      POSTGRES_PASSWORD: horizon
    ports:
      - "5432:5432"
    volumes:
      - horizon_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U horizon -d horizon"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  horizon_postgres_data:
